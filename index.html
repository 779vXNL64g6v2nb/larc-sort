<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラルクソート</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gen-jyuu-gothic-webfont@1.0.0/GenJyuuGothic-Bold.css">
  <meta name="theme-color" content="#70d6ff">
</head>
<body>
  <div class="container">
    <h1>ラルクソート</h1>
    
    <!-- 1. 対戦エリア -->
    <div id="battle-area">
      <p id="progress">直感で選んでください</p>
      
      <div class="button-group">
        <!-- 左の曲 -->
        <div class="song-card">
          <button id="btn-left" onclick="selectChoice(-1)">---</button>
          <div class="links">
            <a id="link-left-lyric" href="#" target="_blank" rel="noopener">🔍 歌詞</a>
            <a id="link-left-yt" href="#" target="_blank" rel="noopener">▶ YouTube</a>
          </div>
        </div>

        <!-- 右の曲 -->
        <div class="song-card">
          <button id="btn-right" onclick="selectChoice(1)">---</button>
          <div class="links">
            <a id="link-right-lyric" href="#" target="_blank" rel="noopener">🔍 歌詞</a>
            <a id="link-right-yt" href="#" target="_blank" rel="noopener">▶ YouTube</a>
          </div>
        </div>
      </div>

      <div class="sub-buttons">
        <button onclick="selectChoice(0)" class="btn-draw">🤝 引き分け（甲乙つけがたい）</button>
        <button onclick="selectChoice(2)" class="btn-unknown">❓ どちらも知らない</button>
      </div>

      <!-- ★対戦中もいつでも押せるリセットボタンを追加 -->
      <button onclick="resetState()" style="margin-top: 30px; background: rgba(0,0,0,0.5); color: #ccc; border: 1px solid #666; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; cursor: pointer;">🔄 最初からやり直す</button>
    </div>

    <!-- 2. 結果エリア -->
    <div id="result-area" style="display: none;">
      <h2>ランキング結果</h2>
      
      <button id="btn-copy" onclick="copyResult()">📋 全順位をコピーする</button>
      <p id="copy-msg" style="color: #00d2ff; font-size: 0.85rem; display: none; margin-top: 5px;">クリップボードにコピーしました！</p>

      <ol id="result-list"></ol>
      
            <button onclick="resetState()" style="margin-top: 30px; background: rgba(0,0,0,0.5); color: #ccc; border: 1px solid #666; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; cursor: pointer;">🔄 最初からやり直す</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
